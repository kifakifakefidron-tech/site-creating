name: Сборка и публикация блога

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # каждый день в 06:00 по Москве — обновить объекты из фида
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история нужна для сводки: когда появилась каждая статья
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pillow
      - name: Шрифт Oswald для обложек
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/Oswald.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf" || true
      - name: Сборка сайта
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          BASE_URL: ${{ vars.BASE_URL || 'https://kifakifakefidron-tech.github.io/site-creating' }}
          METRIKA_COUNTER: ${{ vars.METRIKA_COUNTER }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          MAIN_COUNTER: ${{ vars.MAIN_COUNTER || '99759284' }}
        run: |
          python build.py
          python tilda_csv.py
          python stats.py || echo "сводка не собралась — сайт публикуем всё равно"
          echo '### Отчёт сборки' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/build-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
