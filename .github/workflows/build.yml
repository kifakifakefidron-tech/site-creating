name: Сборка и публикация блога

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # каждый день в 06:00 по Москве — обновить объекты из фида
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Сборка сайта
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          BASE_URL: ${{ vars.BASE_URL || 'https://kifakifakefidron-tech.github.io/site-creating' }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
