name: Сборка и публикация блога

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # каждый день в 06:00 по Москве — обновить объекты из фида
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история нужна для сводки: когда появилась каждая статья
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pillow
      - name: Шрифт Oswald для обложек
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/Oswald.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf" || true
      - name: Адрес блога (свой домен из настроек Pages, если он уже работает)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ vars.BASE_URL }}"
          if [ -z "$url" ]; then
            cname=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/pages" | python3 -c "import json,sys;print(json.load(sys.stdin).get('cname') or '')" || true)
            if [ -n "$cname" ]; then
              echo "DNS $cname: $(getent hosts "$cname" | head -3 | tr '\n' ' ')"
              # домен указан в Pages → GitHub уже перенаправляет github.io на него, поэтому собираем под домен,
              # как только DNS смотрит на GitHub (сертификат HTTPS GitHub выпустит сам)
              if getent hosts "$cname" | grep -qE '185\.199\.(108|109|110|111)\.153'; then
                url="https://$cname"
              else
                echo "::warning::Домен $cname указан в настройках Pages, но DNS ещё не указывает на GitHub — пока собираем под github.io"
              fi
            fi
          fi
          url="${url:-https://kifakifakefidron-tech.github.io/site-creating}"
          echo "Адрес блога: $url"
          echo "BASE_URL=$url" >> "$GITHUB_ENV"
      - name: Яндекс Вебмастер — добавить сайт и получить код подтверждения
        env:
          WEBMASTER_TOKEN: ${{ secrets.WEBMASTER_TOKEN }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: python webmaster.py prepare || true
      - name: Сборка сайта
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          WEBMASTER_TOKEN: ${{ secrets.WEBMASTER_TOKEN }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          METRIKA_COUNTER: ${{ vars.METRIKA_COUNTER }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          MAIN_COUNTER: ${{ vars.MAIN_COUNTER || '99759284' }}
        run: |
          python build.py
          python tilda_csv.py
          python stats.py || echo "сводка не собралась — сайт публикуем всё равно"
          echo '### Отчёт сборки' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/build-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  webmaster:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Яндекс Вебмастер — подтвердить права и отправить sitemap
        env:
          GH_TOKEN: ${{ github.token }}
          WEBMASTER_TOKEN: ${{ secrets.WEBMASTER_TOKEN }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: |
          url="${{ vars.BASE_URL }}"
          if [ -z "$url" ]; then
            cname=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pages" | python3 -c "import json,sys;print(json.load(sys.stdin).get('cname') or '')" || true)
            [ -n "$cname" ] && getent hosts "$cname" | grep -qE '185\.199\.(108|109|110|111)\.153' && url="https://$cname"
          fi
          [ -z "$url" ] && { echo "Свой домен ещё не подключён — Вебмастер пропускаем"; exit 0; }
          sleep 60   # дать новой версии сайта разойтись по CDN
          BASE_URL="$url" python webmaster.py verify || true
