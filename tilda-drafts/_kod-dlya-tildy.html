<!-- ============================================================
  3) КАРТОЧКИ ОБЪЕКТОВ (tproduct) — запасной вариант.
  Правильный путь: в Тильде у каждого товара заполнить вкладку SEO
  (заголовок и описание). Пока не заполнено — этот скрипт делает
  уникальный title и description из данных карточки.
  Вставить: Настройки сайта → Ещё → «HTML-код для вставки внутрь HEAD».
  Работает только на страницах /tproduct/, остальные не трогает.
  ============================================================ -->
<script>
(function () {
  if (location.pathname.indexOf('/tproduct/') !== 0) return;

  function run() {
    var h1 = document.querySelector('.t-store__prod-popup__name, .js-store-prod-name, h1');
    var descEl = document.querySelector('.t-store__prod-popup__text, .js-store-prod-text');
    if (!h1 || !descEl) return false;

    var zhk = h1.textContent.trim();                       // «ЖК ДВИЖЕНИЕ»
    var text = descEl.innerText || '';
    var lines = text.split('\n').map(function (s) {
      return s.replace(/[♟➳➵જ⁀➴📞]/g, '').trim();
    }).filter(Boolean);

    var type = (lines[0] || 'Квартира');                    // «СТУДИЯ» / «1К» ...
    type = type.charAt(0) + type.slice(1).toLowerCase();

    var area = (text.match(/(\d+[.,]?\d*)\s*м2/) || [])[1];
    var floor = (text.match(/Этаж:\s*([\d\/]+)/i) || [])[1];
    var district = (lines.find(function (l) { return /^РАЙОН/i.test(l); }) || '')
      .replace(/^РАЙОН\s*/i, '');
    var price = (text.match(/Цена\s*-\s*([\d\s]+)/i) || [])[1];

    var zhkNice = zhk.replace(/^ЖК\s*/i, 'ЖК ').toLowerCase()
      .replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }).replace('Жк', 'ЖК');

    var title = type + (area ? ' ' + area + ' м²' : '') + ', ' + zhkNice +
      (district ? ', ' + district.charAt(0) + district.slice(1).toLowerCase() : '') +
      ' — купить на вторичке в Краснодаре | СТРЕЛЫ';

    var desc = 'Продаётся ' + type.toLowerCase() + (area ? ' ' + area + ' м²' : '') +
      (floor ? ', этаж ' + floor : '') + ' в ' + zhkNice + ', Краснодар' +
      (price ? '. Цена ' + price.trim() + ' тыс. ₽' : '') +
      '. Фото, описание, PDF-презентация для клиента.';

    document.title = title;
    var m = document.querySelector('meta[name="description"]');
    if (!m) { m = document.createElement('meta'); m.name = 'description'; document.head.appendChild(m); }
    m.setAttribute('content', desc);

    // alt у фото объекта
    document.querySelectorAll('.t-slds__item img, .t-store__prod-popup__slider img').forEach(function (img, i) {
      if (!img.getAttribute('alt')) img.setAttribute('alt', zhkNice + ', ' + type.toLowerCase() + ' — фото ' + (i + 1));
    });
    return true;
  }

  if (!run()) {
    var tries = 0, t = setInterval(function () { if (run() || ++tries > 20) clearInterval(t); }, 300);
  }
})();
</script>
